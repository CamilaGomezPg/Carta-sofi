<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NightWave</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="titlebar">
    <div id="brand">NIGHTWAVE</div>
    <div id="win-controls">
      <button id="btn-min">&#8211;</button>
      <button id="btn-max">&#9633;</button>
      <button id="btn-close">&#10005;</button>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <button id="btn-choose-folder">📁 Elegir carpeta de música</button>
      <div id="folder-label">Sin carpeta seleccionada</div>
      <input id="search" type="text" placeholder="Buscar canción...">
      <ul id="track-list"></ul>
    </aside>

    <main id="main-view">
      <canvas id="visualizer"></canvas>
      <div id="now-playing">
        <div id="track-title">Nada reproduciéndose</div>
        <div id="track-time">0:00 / 0:00</div>
      </div>

      <div id="controls">
        <button id="btn-prev">⏮</button>
        <button id="btn-play">▶</button>
        <button id="btn-next">⏭</button>
        <input id="seek" type="range" min="0" max="100" value="0">
        <input id="volume" type="range" min="0" max="100" value="80">
      </div>
    </main>
  </div>

  <audio id="audio"></audio>
  <script src="renderer.js"></script>
</body>
</html>
